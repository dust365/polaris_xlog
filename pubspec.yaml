name: xlog_plugin
description: A Flutter plugin wrapping Tencent mars-xlog. High-performance, encrypted, daily-rotated logging with developer-mode log upload.
version: 0.1.0
homepage: https://github.com/youfi/mlog
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.youfi.xlog_plugin
        pluginClass: XlogPlugin
      ios:
        pluginClass: XlogPlugin
