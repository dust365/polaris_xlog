group 'com.youfi.xlog_plugin'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // mars-xlog is not on Maven Central; use Alibaba mirror which hosts it
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.youfi.xlog_plugin'
    compileSdk 34

    defaultConfig {
        minSdk 21
        // mars-xlog ships native .so for these ABIs
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Tencent mars xlog: high-performance, encrypted, mmap-backed logging.
    implementation 'com.tencent.mars:mars-xlog:1.2.6'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
