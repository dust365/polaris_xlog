group 'com.youfi.xlog_plugin'
version '0.2.0'

// AGP / Kotlin versions come from the host app's settings.gradle.kts
// (YouFi: AGP 8.11.1, Kotlin 2.2.20). Do not pin an older buildscript here.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.youfi.xlog_plugin'
    compileSdk 36

    defaultConfig {
        minSdk 21
        // Aligned with YouFi (android/app/build.gradle.kts): ship arm64 only.
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Ship JNI keep-rules to consumer apps so R8/ProGuard never renames the
        // mars-xlog glue classes that libmarsxlog.so resolves by name.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // Tencent mars xlog is built from source and vendored (see native/):
    //   - native .so       -> src/main/jniLibs/<abi>/
    //   - Java glue classes -> src/main/java/com/tencent/mars/xlog/
}
