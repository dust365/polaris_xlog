name: polaris_xlog_example
description: Demonstrates polaris_xlog with a developer-mode log upload screen.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  polaris_xlog:
    path: ../
  # Upload is the app's responsibility (the plugin ships no HTTP client);
  # this example uses package:http to demonstrate it.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
